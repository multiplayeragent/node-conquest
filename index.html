<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Node Conquest</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #0c1322; }
  body { font: 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  #top { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); width: min(620px, calc(100vw - 24px)); pointer-events: none; }
  #bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: #ffffff14; box-shadow: 0 2px 10px #0008; }
  #bar i { display: block; height: 100%; transition: width .45s ease; }
  #row { display: flex; align-items: flex-start; gap: 8px; margin-top: 6px; }
  #chips { flex: 1; display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; font-weight: 700; text-shadow: 0 1px 2px #000; }
  #chips span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; } #chips span.out { opacity: .35; text-decoration: line-through; }
  #chips b { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 6px var(--c); }
  #chips span.me { color: #ffe08a; }
  #clock { font: 800 15px system-ui, sans-serif; font-variant-numeric: tabular-nums; padding: 1px 10px; border-radius: 999px; background: #0009; }
  #count { position: fixed; inset: 0; display: grid; place-items: center; font-size: min(22vw, 150px); font-weight: 900; text-shadow: 0 6px 0 #0007; pointer-events: none; }
  #hint { position: fixed; left: 50%; bottom: calc(max(10px, env(safe-area-inset-bottom)) + 30px); transform: translateX(-50%); max-width: calc(100vw - 32px); box-sizing: border-box;
          background: #000b; padding: 8px 16px; border-radius: 999px; font-size: 14px; text-align: center; pointer-events: none; transition: opacity .5s; }
  #banner { position: fixed; left: 50%; top: 40%; transform: translateX(-50%); padding: 10px 18px; border-radius: 14px; background: #000c; font-weight: 800; text-align: center; pointer-events: none; }
  #banner[hidden] { display: none; }
  #net { position: fixed; bottom: max(6px, env(safe-area-inset-bottom)); left: 10px; font-size: 12px; opacity: .75; pointer-events: none; white-space: nowrap; text-shadow: 0 1px 2px #000; }
  #over { position: fixed; inset: 0; display: grid; place-items: center; background: #0009; }
  #over[hidden] { display: none; }
  .box { box-sizing: border-box; width: min(380px, calc(100vw - 32px)); max-height: 86vh; overflow: auto; padding: 20px; border-radius: 18px; background: #141d33; border: 1px solid #ffffff22; text-align: center; }
  .box h2 { margin: 0 0 4px; font-size: 26px; } .box p { margin: 0 0 12px; opacity: .85; }
  .box h3 { margin: 6px 0 4px; font-size: 13px; color: #ffd166; text-align: left; }
  .box ol { text-align: left; margin: 0 0 12px; padding-left: 24px; font-size: 14px; min-height: 30px; } .box li span { float: right; }
  .box li.note { list-style: none; margin-left: -24px; text-align: center; opacity: .8; } /* a message, not a ranked row */
  .box button { width: 100%; min-height: 48px; border: 0; border-radius: 12px; background: #ffd166; color: #2a1d00; font: 800 16px system-ui, sans-serif; cursor: pointer; }
  .box small { display: block; margin-top: 8px; opacity: .6; font-size: 12px; }
</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<div id="top"><div id="bar"></div><div id="row"><div id="chips"></div><span id="clock">3:00</span></div></div>
<div id="count"></div>
<div id="banner" hidden></div>
<div id="hint">Drag from your base to another base to send half its troops</div>
<div id="net">Connecting…</div>
<div id="over" hidden><div class="box">
  <h2 id="overTitle"></h2><p id="overSub"></p>
  <h3>Most wins</h3><ol id="board"><li class="note">Loading…</li></ol>
  <button id="again">Play again</button><small id="next"></small>
</div></div>
<script>
/* ═══ NODE CONQUEST · a Multiplayer Agent starter ═════════════════════════════════════════
 * Grow troops, send them out, take every base on the map. Versus, 2–6 players; bots take the empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ match length, troop growth, march speed, base sizes, bots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   MAP ........... building a random map of bases (the host does it once per match)
 *   WAR (HOST) .... troop growth, marching groups, captures, the bots, seats and the match end.
 *                   Only the host runs this and writes the shared fields.
 *   VIEW .......... what everyone draws: the host's live war, or the last snapshot eased forward
 *   DRAW .......... the map (stood up on portrait screens), bases, marching troops, effects
 *   HUD & RESULTS . power bar, clock, results card, leaderboard
 *   INPUT ......... drag (or tap, then tap) from your bases to a target
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - `match` (one JSON field: id, v, phase, startAt, endsAt, seats, winner, why) and `map`
 *     (this match's bases: x, y, size) are written by the HOST only, once per change.
 *   - `w` (the war, packed: every base's owner and troops, every marching group with its
 *     progress) is written by the HOST about 10 times a second. Others move the marching
 *     troops forward on their own between snapshots, so nothing steps.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s). It
 *     grows the troops, marches the groups, resolves every capture and plays every bot. A new
 *     host adopts the last `w`, catches it up to the clock and carries on.
 *   - Each player writes its OWN entity: `n` (name), `c` (color), `hb` (heartbeat).
 *   - To attack, a player sends the intent "send" {m, from: [base…], to}; the host checks each
 *     base is that player's and sends half its troops. "again" {m} = Play again.
 *   - seats[k] = {i: sessionId or "bot…", n, c, b}. A friend who joins takes over a bot that is
 *     still in the fight; a player who leaves hands their seat to a bot.
 *   - ?attract plays offline, six bots (the preview video is recorded from it).
 *   - Leaderboard "wins": +1 for each match a player wins, shown on the results card.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  seats: 4,             // players on the map; bots fill the empty seats (2 to 6)
  matchMs: 180000,      // a match lasts 3 minutes, then the most troops wins
  countdownMs: 3000,    // 3, 2, 1 before troops can move
  resultsMs: 12000,     // the results card shows this long, then a new map
  startTroops: 20,      // troops on each player's first base
  neutralMin: 6,        // troops on an empty base at the start: between these two,
  neutralMax: 22,       //   times 1 / 1.5 / 2 for the three base sizes
  sendShare: 0.5,       // a drag sends this share of each chosen base's troops
  speed: 115,           // troops march this many map units a second (the map is 1600 x 1000)
  maxGroups: 40,        // marching groups on the map at once
  decayMs: 800,         // a base over its cap loses one troop this often
  botThinkMs: 1500,     // each bot looks at the map about this often
  botMinTroops: 10,     // a bot only sends from bases holding at least this many
  seatGraceMs: 6000,    // a player silent this long hands their seat to a bot
  board: "wins",        // leaderboard name
  // The three base sizes: r = radius in map units, cap = most troops it grows to, growMs = +1 troop this often.
  sizes: [
    { name: "Outpost", r: 40, cap: 40,  growMs: 1150 },
    { name: "Town",    r: 50, cap: 70,  growMs: 820 },
    { name: "Citadel", r: 62, cap: 110, growMs: 580 },
  ],
};
const COLORS = ["#4f8cff", "#ff5a5f", "#3ecf7a", "#ffc23d", "#b77bff", "#ff8a3d", "#2fd4d4", "#ff6fb5"];
const GREY = "#7d8799";
const BOT_NAMES = ["Ada", "Bram", "Cleo", "Dax", "Echo", "Fern", "Gus", "Hana"];
const NAME_A = ["Swift", "Iron", "Bold", "Lucky", "Sly", "Grand"], NAME_B = ["General", "Marshal", "Warlord", "Captain", "Admiral", "Baron"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'node-conquest',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const memo = new Map();
/** A shared JSON field, parsed once per change (read-only: never mutate what this returns). */
function shared(key, fallback) {
  const raw = S.shared[key], m = memo.get(key);
  if (m && m.raw === raw) return m.v;
  const v = parse(raw, fallback);
  memo.set(key, { raw, v, at: performance.now() });
  return v;
}
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let wakeHold = 0, lastFrameAt = 0; // a tab whose frames stopped (frozen, or in the background) doesn't act as host, nor for 700ms after it wakes (see frame())
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() >= wakeHold && !(lastFrameAt && performance.now() - lastFrameAt > 1000);
const stillHere = (id) => id === net.sessionId || (!!S.entities.players[id] && performance.now() - (seenHb.get(id)?.at ?? -1e9) < CONFIG.seatGraceMs);

// ── MAP ─────────────────────────────────────────────────────────────────────────────
// Map units: x 0..1600, y 0..1000. Each base is { x, y, t (size 0/1/2), home (seat or -1), start (troops) }.
const MAP = { w: 1600, h: 1000 };
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const rnd = (a, b) => a + Math.random() * (b - a);
/** A fresh random map: one home base per seat around the edge, empty bases everywhere else. */
function makeMap(seats) {
  const bases = [], off = Math.random() * Math.PI * 2;
  for (let s = 0; s < seats; s++) {
    const a = off + (s / seats) * Math.PI * 2;
    bases.push({ x: Math.round(MAP.w / 2 + Math.cos(a) * MAP.w * 0.39), y: Math.round(MAP.h / 2 + Math.sin(a) * MAP.h * 0.37), t: 1, home: s, start: CONFIG.startTroops });
  }
  const want = 8 + seats * 3;
  for (let tries = 0; bases.length < want && tries < 5000; tries++) {
    const x = rnd(80, MAP.w - 80), y = rnd(80, MAP.h - 80), gap = tries < 3000 ? 180 : 150;
    if (bases.some((b) => dist(b, { x, y }) < gap)) continue;
    const central = 1 - Math.min(1, Math.hypot((x - MAP.w / 2) / (MAP.w / 2), (y - MAP.h / 2) / (MAP.h / 2)));
    const roll = Math.random() + central * 0.45, t = roll > 1.05 ? 2 : roll > 0.62 ? 1 : 0;
    bases.push({ x: Math.round(x), y: Math.round(y), t, home: -1, start: Math.round(rnd(CONFIG.neutralMin, CONFIG.neutralMax) * (1 + t * 0.5)) });
  }
  return bases;
}
const mapMemo = { raw: undefined, list: null };
/** This match's bases, from the host's own copy or the shared `map` field. */
function mapOf(m) {
  if (!m) return null;
  if (isHost() && world.matchId === m.id && world.map.length) return world.map;
  const raw = S.shared.map;
  if (raw !== mapMemo.raw) {
    mapMemo.raw = raw;
    const d = parse(raw, null);
    mapMemo.list = d && Array.isArray(d.b) ? { m: d.m, b: d.b.map(([x, y, t, home, start]) => ({ x, y, t, home, start })) } : null;
  }
  return mapMemo.list && mapMemo.list.m === m.id ? mapMemo.list.b : null;
}

// ── WAR (HOST) ──────────────────────────────────────────────────────────────────────
const STEP = 0.05; // the war moves in 50ms steps
const host = { last: null, again: new Set() };
const world = { matchId: -1, map: [], own: [], cnt: [], groups: [], nextId: 1, acc: 0, lastTick: 0, lastWrite: 0, wasHost: false, bots: {} };
/** The match as state has it, or the host's own newer write that hasn't come back yet. */
function match() {
  const m = shared("match", null);
  return host.last && isHost() && (!m || host.last.v > m.v) ? host.last : m;
}
function writeMatch(m) { m = { ...m, v: (match()?.v ?? 0) + 1 }; host.last = m; net.setShared("match", JSON.stringify(m)); return m; }
const colorOf = (id) => (id === net.sessionId ? myColor : S.entities.players[id]?.c || COLORS[0]);
const nameOf = (id) => (id === net.sessionId ? myName : S.entities.players[id]?.n || "Player");
/** A new match: the live players first, bots up to CONFIG.seats, a fresh map. */
function newMatch(id) {
  const humans = ATTRACT ? [] : livePlayers().slice(0, 6), seats = [], used = new Set();
  for (const h of humans) { let c = colorOf(h); if (used.has(c)) c = COLORS.find((x) => !used.has(x)); used.add(c); seats.push({ i: h, n: nameOf(h), c, b: 0 }); }
  for (let k = 0; seats.length < Math.max(2, Math.min(6, Math.max(CONFIG.seats, humans.length))); k++) {
    const c = COLORS.find((x) => !used.has(x)); used.add(c);
    seats.push({ i: "bot" + k, n: BOT_NAMES[k], c, b: 1 });
  }
  for (let i = seats.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [seats[i], seats[j]] = [seats[j], seats[i]]; } // random home spots
  const map = makeMap(seats.length), t = Date.now();
  resetWorld(id, map);
  net.setShared("map", JSON.stringify({ m: id, b: map.map((b) => [b.x, b.y, b.t, b.home, b.start]) }));
  host.again.clear();
  return writeMatch({ id, phase: "play", startAt: t + CONFIG.countdownMs, endsAt: t + CONFIG.countdownMs + CONFIG.matchMs, seats, winner: -1, why: "" });
}
function resetWorld(id, map) {
  Object.assign(world, { matchId: id, map, own: map.map((b) => b.home), cnt: map.map((b) => b.start), groups: [], nextId: 1, bots: {} });
}
/** Become host: take the war over exactly as the last `w` has it, caught up to now. */
function adoptWorld(m) {
  const map = mapOf(m) || [], w = shared("w", null);
  resetWorld(m.id, map.map((b) => ({ ...b })));
  if (!w || w.m !== m.id) return;
  world.own = w.o.slice(); world.cnt = w.c.slice();
  world.groups = w.g.map(([id, s, a, b, n, p]) => ({ id, s, a, b, n, p: p / 1000, d: dist(map[a], map[b]) }));
  world.nextId = Math.max(0, ...world.groups.map((g) => g.id)) + 1;
  if (m.phase !== "play") return;
  const behind = Math.max(0, Math.min(5, (Date.now() - Math.max(w.t, m.startAt)) / 1000)); // a frozen host left a gap
  for (let k = 0; k < behind / STEP; k++) warStep(STEP);
}
/** A "send" intent (or the host's own drag, or a bot): half of each chosen base marches to `to`. */
function applySend(seat, d) {
  const m = match(), map = world.map;
  if (!m || !d || m.phase !== "play" || d.m !== m.id || Date.now() < m.startAt || seat < 0) return false;
  const to = Math.floor(+d.to);
  if (!(to >= 0 && to < map.length) || !Array.isArray(d.from)) return false;
  let sent = 0;
  for (const a of [...new Set(d.from.map(Number))].slice(0, 12)) {
    if (a === to || world.own[a] !== seat || world.groups.length >= CONFIG.maxGroups) continue;
    const n = Math.floor(world.cnt[a] * CONFIG.sendShare);
    if (n < 1) continue;
    world.cnt[a] -= n;
    world.groups.push({ id: world.nextId++, s: seat, a, b: to, n, p: 0, d: dist(map[a], map[to]) });
    sent++;
  }
  return sent > 0;
}
/** One step of the war: bases grow (or shrink back to their cap), groups march and land. */
function warStep(dt) {
  const map = world.map;
  for (let i = 0; i < map.length; i++) {
    if (world.own[i] < 0) continue;
    const Z = CONFIG.sizes[map[i].t];
    if (world.cnt[i] < Z.cap) world.cnt[i] = Math.min(Z.cap, world.cnt[i] + (dt * 1000) / Z.growMs);
    else world.cnt[i] = Math.max(Z.cap, world.cnt[i] - (dt * 1000) / CONFIG.decayMs);
  }
  for (const g of world.groups) g.p += (dt * CONFIG.speed) / Math.max(1, g.d);
  for (const g of world.groups.filter((g) => g.p >= 1)) land(g);
  world.groups = world.groups.filter((g) => g.p < 1);
}
/** A group reaches its target: reinforce your own base, or fight; more than they have = it's yours. */
function land(g) {
  if (world.own[g.b] === g.s) { world.cnt[g.b] += g.n; return; }
  world.cnt[g.b] -= g.n;
  if (world.cnt[g.b] < 0) { world.own[g.b] = g.s; world.cnt[g.b] = -world.cnt[g.b]; }
}
/** Troops, bases and groups for each seat. A seat with no base and no group is out. */
function tally(own, cnt, groups, seats) {
  const out = Array.from({ length: seats }, () => ({ troops: 0, bases: 0, groups: 0 }));
  own.forEach((o, i) => { if (o >= 0 && out[o]) { out[o].troops += cnt[i]; out[o].bases++; } });
  for (const g of groups) if (out[g.s]) { out[g.s].troops += g.n; out[g.s].groups++; }
  return out.map((x) => ({ ...x, troops: Math.floor(x.troops), alive: x.bases > 0 || x.groups > 0 }));
}
/** The match ends when one seat is left, when every person is out, or when time runs out. */
function checkEnd(m, t) {
  if (!m || m.phase !== "play" || t < m.startAt) return;
  const tl = tally(world.own, world.cnt, world.groups, m.seats.length), alive = tl.map((x, k) => (x.alive ? k : -1)).filter((k) => k >= 0);
  const most = () => { const top = Math.max(...alive.map((k) => tl[k].troops)), lead = alive.filter((k) => tl[k].troops === top); return lead.length === 1 ? lead[0] : -2; };
  const people = m.seats.some((s) => !s.b), peopleIn = m.seats.some((s, k) => !s.b && tl[k].alive);
  let winner = null, why = "";
  if (alive.length <= 1) { winner = alive.length ? alive[0] : -2; why = "Knocked everyone off the map"; }
  else if (people && !peopleIn && !ATTRACT) { winner = most(); why = "Every player was knocked out"; }
  else if (t >= m.endsAt) { winner = most(); why = winner === -2 ? "Dead even on troops" : "Most troops when time ran out"; }
  if (winner === null) return;
  writeMatch({ ...m, phase: "over", winner, why, endsAt: t + CONFIG.resultsMs });
}
/** Gone players hand their seat to a bot; a waiting player takes over a bot still in the fight. */
function fixSeats(m) {
  if (ATTRACT) return m;
  const seats = m.seats.map((s) => ({ ...s })), waiting = livePlayers().filter((id) => !seats.some((s) => s.i === id));
  const tl = tally(world.own, world.cnt, world.groups, seats.length);
  let changed = false;
  seats.forEach((s, k) => {
    if (!s.b && !stillHere(s.i)) { Object.assign(s, { i: `bot-${m.id}-${k}`, n: BOT_NAMES.find((b) => !seats.some((x) => x.n === b)) || "Bot", b: 1 }); changed = true; }
    else if (s.b && waiting.length && m.phase === "play" && tl[k].alive) { const id = waiting.shift(); Object.assign(s, { i: id, n: nameOf(id), b: 0 }); changed = true; }
    else if (!s.b && S.entities.players[s.i]?.n && s.n !== nameOf(s.i)) { s.n = nameOf(s.i); changed = true; } // their name arrived after they sat down
  });
  return changed ? writeMatch({ ...m, seats }) : m;
}
/** A bot: take the juiciest base it can beat, else move a full base's troops toward the front. */
function botTick(k, m, now) {
  const b = world.bots[k] || (world.bots[k] = { nextAt: now + rnd(400, 1400) });
  if (now < b.nextAt) return;
  b.nextAt = now + CONFIG.botThinkMs * rnd(0.6, 1.4);
  const map = world.map, mine = map.map((_, i) => i).filter((i) => world.own[i] === k);
  if (!mine.length) return;
  const coming = new Map();
  for (const g of world.groups) if (g.s === k) coming.set(g.b, (coming.get(g.b) || 0) + g.n);
  let best = null;
  for (let to = 0; to < map.length; to++) {
    if (world.own[to] === k) continue;
    const enemy = world.own[to] >= 0, near = mine.filter((i) => world.cnt[i] >= CONFIG.botMinTroops).sort((a, c) => dist(map[a], map[to]) - dist(map[c], map[to]));
    let sum = 0;
    for (let n = 1; n <= Math.min(3, near.length); n++) {
      sum += Math.floor(world.cnt[near[n - 1]] * CONFIG.sendShare);
      const secs = dist(map[near[n - 1]], map[to]) / CONFIG.speed;
      const need = world.cnt[to] + (enemy ? (secs * 1000) / CONFIG.sizes[map[to].t].growMs : 0) + 2 - (coming.get(to) || 0);

  if (!canAct()) return;

  if (sel.length && !drag && i >= 0 && !sel.includes(i)) { sendTo(i); return; } // second tap of tap-then-tap
  if (mineHere) { drag = { sx: e.clientX, sy: e.clientY, moved: false, was: sel.slice() }; sel = [i]; target = -1; cv.setPointerCapture(e.pointerId); }
  else { sel = []; target = -1; }
});
cv.addEventListener("pointermove", (e) => {
  pointer = { x: e.clientX, y: e.clientY };
  if (!drag) { if (sel.length) target = baseAt(e.clientX, e.clientY); return; }
  if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 12) drag.moved = true;
  const i = baseAt(e.clientX, e.clientY);
  if (drag.moved && i >= 0 && !sel.includes(i) && ownerNow(i) === mySeat(match())) sel.push(i); // sweep over more of your bases
  target = i;
});
cv.addEventListener("pointerup", (e) => {
  if (!drag) return;
  const d = drag; drag = null;
  const i = baseAt(e.clientX, e.clientY);
  if (!d.moved) { if (d.was.length === 1 && d.was[0] === sel[0]) sel = []; target = -1; return; } // a tap: keep it chosen (tap again to drop it)
  if (i >= 0 && !(sel.length === 1 && sel[0] === i)) sendTo(i); else { sel = []; target = -1; }
});
cv.addEventListener("contextmenu", (e) => e.preventDefault()); // no browser menu on right-click
cv.addEventListener("pointercancel", () => { drag = null; sel = []; target = -1; });
addEventListener("blur", () => { drag = null; sel = []; target = -1; }); // switching tabs mid-drag drops it
addEventListener("keydown", (e) => { if (e.key === "Escape") { sel = []; target = -1; } });
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let myName = "", myColor = COLORS[0], last = performance.now(), lastHb = 0, lastHud = 0, seenMatch = -1;
try { myName = localStorage.getItem("mpa-name") || ""; } catch {}
const pickOne = (list) => list[Math.floor(Math.random() * list.length)];
if (!myName) { myName = pickOne(NAME_A) + " " + pickOne(NAME_B); try { localStorage.setItem("mpa-name", myName); } catch {} }
if (ATTRACT) {
  Object.assign(CONFIG, { seats: 6, countdownMs: 0, startTroops: 40, speed: 190, botThinkMs: 600, botMinTroops: 16, neutralMin: 3, neutralMax: 12, resultsMs: 2500, matchMs: 90000 });
  CONFIG.sizes.forEach((z) => { z.growMs *= 0.45; });
  $("hint").style.display = "none";
}
/** Two players picked the same color at once (the room can look empty as you join): the later sessionId picks again. */
function fixColor() {
  const m = match(), others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId), bots = m ? m.seats.filter((s) => s.b).map((s) => s.c) : [];
  if (!others.some(([id, p]) => id < net.sessionId && p.c === myColor) && !bots.includes(myColor)) return;
  const used = new Set([...others.map(([, p]) => p.c), ...bots]), free = COLORS.find((c) => !used.has(c));
  if (free && free !== myColor) { myColor = free; net.me.set("c", myColor); }
}

function frame(now) {
  requestAnimationFrame(frame);
  const realNow = performance.now(); // timed on the real clock: after a long freeze the rAF time can be from before the wake
  if (lastFrameAt && realNow - lastFrameAt > 1000) { wakeHold = realNow + 700; world.wasHost = false; host.last = null; } lastFrameAt = realNow; // woke from a freeze or a background tab: another player may have run the war meanwhile, so let their state arrive, then adopt it like a new host
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(now); else { world.wasHost = false; host.last = null; }
  const m = match(), map = mapOf(m);
  if (m && map) {
    if (seenMatch !== m.id) { seenMatch = m.id; sel = []; target = -1; drag = null; fx.own = null; fx.groups.clear(); groupViews.clear(); sparks.length = rings.length = pops.length = 0; hintUntil = performance.now() + 16000; }
    const v = viewOf(m, map, dt);
    effects(m, map, v, now);
    draw(m, map, v, dt, now);
    if (now - lastHud > 100) { lastHud = now; hud(m, v); }
  }
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("send", (d, from) => { if (isHost()) applySend(match()?.seats.findIndex((s) => s.i === from) ?? -1, d); });
  net.on("again", (d, from) => { if (isHost()) hostAgain(from, d); });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
  myColor = COLORS.find((c) => !taken.has(c)) || pickOne(COLORS);
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  requestAnimationFrame(frame);
})();
</script>
